name: musesapi

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vivid_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-12345678}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vivid_ai"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  musesapi:
    image: ${MUSESAPI_IMAGE:-heself/musesapi:latest}
    environment:
      APP_ENV: production
      APP_TITLE: ${APP_TITLE:-MusesAPI}
      HTTP_ADDR: 0.0.0.0:2000
      POSTGRES_DSN: host=postgres user=postgres password=${POSTGRES_PASSWORD:-12345678} dbname=vivid_ai port=5432 sslmode=disable TimeZone=Asia/Shanghai
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      REDIS_DB: "0"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:2000,http://127.0.0.1:2000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-2000}:2000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Optional reverse proxy. It is skipped by a normal `docker compose up`.
  # Start it with: docker compose --profile proxy up -d
  nginx:
    image: nginx:1.27-alpine
    profiles: ["proxy"]
    ports:
      - "${NGINX_BIND:-0.0.0.0}:${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      musesapi:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
