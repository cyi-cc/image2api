name: Create GitHub Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing Git tag to release (for example v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build binaries and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Check out tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
            if ! git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
              echo "::error::Tag '${TAG}' does not exist"
              exit 1
            fi
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Copy frontend into Go embed directory
        run: |
          rm -rf backend/internal/frontend/dist
          mkdir -p backend/internal/frontend/dist
          cp -R frontend/dist/. backend/internal/frontend/dist/

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build Linux binaries
        working-directory: backend
        env:
          CGO_ENABLED: "0"
        run: |
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../musesapi-linux-amd64 ./cmd/api
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o ../musesapi-linux-arm64 ./cmd/api

      - name: Package Compose deployment files
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir -p release-compose
          cp docker/musesapi/compose.yml docker/musesapi/nginx.conf docker/musesapi/README.md release-compose/
          sed -i "s|image: \${MUSESAPI_IMAGE:-heself/musesapi:latest}|image: heself/musesapi:${TAG}|" release-compose/compose.yml
          tar -czf "musesapi-compose-${TAG}.tar.gz" -C release-compose .
          sha256sum musesapi-linux-amd64 musesapi-linux-arm64 "musesapi-compose-${TAG}.tar.gz" > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
          files: |
            musesapi-linux-amd64
            musesapi-linux-arm64
            musesapi-compose-${{ steps.version.outputs.tag }}.tar.gz
            checksums.txt
